# Dataset links for the fMOST / projectome plotting pipeline.
#
# Every path may be absolute (UNC or drive letter), start with ~, or be relative
# to the repository root. `null` means "not available for this sample": the
# pipeline reports it and still renders every panel whose inputs exist.
#
# Operator check:  cd main_scripts; python -m Visual_toolkit.dataset_config --check
# Override file:   set PROJECTOME_DATASETS=<path to another yaml>
#
# Provenance: ds00_processed paths and sha256 values are the sources recorded in
# each sample's N4 run manifest under work/ds_preprocessing/. resample_5um is
# relative to defaults.resample_5um_root; swc_cache is relative to
# defaults.swc_cache_root.

version: 1

defaults:
  ds00_root: '\\10.102.8.200\microscopy_data\fMOST\CH00DS_datasets'
  resample_5um_root: '\\10.102.8.200\microscopy_data\fMOST\5micron_datasets'
  swc_cache_root: 'group_analysis/visual_review_20261002/swc_raw'

# GUI defaults (also editable in the window). `output_root` is where renders are
# written and where "Reload figures" looks for existing panels; paths are
# repo-relative unless absolute.
visual_toolkit:
  output_root: 'work/visual_gui'
  auto_reload: true

